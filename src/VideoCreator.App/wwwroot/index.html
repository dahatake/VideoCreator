<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoCreator</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/fluent.bundle.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">メインへ移動</a>
  <header class="appbar" role="banner">
    <a class="brand" href="#/" aria-label="VideoCreator ホーム">
      <img src="/img/icon.svg" width="28" height="28" alt="">
      <span>VideoCreator</span>
    </a>
    <span class="appbar-sub">長尺動画からショートを自動編集</span>
    <span class="spacer"></span>
    <span id="provider" class="provider" aria-live="polite"></span>
    <fluent-button id="settings-btn" appearance="subtle" aria-label="設定">設定</fluent-button>
  </header>
  <nav class="steps" id="steps" aria-label="作業の手順"></nav>
  <main id="main" tabindex="-1"></main>
  <fluent-dialog id="settings-dialog" type="modal">
    <fluent-dialog-body>
      <h2 slot="title">設定</h2>
      <div id="settings-body"></div>
      <fluent-button slot="action" appearance="primary" id="settings-close">閉じる</fluent-button>
    </fluent-dialog-body>
  </fluent-dialog>
  <fluent-dialog id="delete-dialog" type="alert" aria-label="プロジェクトの削除">
    <fluent-dialog-body>
      <h2 slot="title">プロジェクトを削除しますか？</h2>
      <div id="delete-body"></div>
      <fluent-button slot="action" appearance="primary" class="danger" id="delete-confirm">削除する</fluent-button>
      <fluent-button slot="action" id="delete-cancel" autofocus>キャンセル</fluent-button>
    </fluent-dialog-body>
  </fluent-dialog>
</body>
</html>
