<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>VideoCreator</title>
  <defs>
    <!-- Fluent icon guidance: 120° default gradient angle, 1–2 step ramps, ambient light from the top-left -->
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(30 .5 .5)">
      <stop offset="0" stop-color="#9CCBFF"/>
      <stop offset="1" stop-color="#6E9CF5"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(30 .5 .5)">
      <stop offset="0" stop-color="#2B88D8"/>
      <stop offset=".55" stop-color="#0F6CBD"/>
      <stop offset="1" stop-color="#4F3BC4"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#F7630C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#0B1E4A" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- metaphor 1: a long (landscape) source clip behind, cut into a vertical short in front -->
  <rect x="4" y="7" width="31" height="20" rx="2" fill="url(#back)"/>
  <rect x="8" y="10" width="3" height="2" rx=".5" fill="#FFFFFF" opacity=".55"/>
  <rect x="13" y="10" width="3" height="2" rx=".5" fill="#FFFFFF" opacity=".55"/>
  <rect x="18" y="10" width="3" height="2" rx=".5" fill="#FFFFFF" opacity=".55"/>
  <g filter="url(#shadow)">
    <rect x="17" y="12" width="20" height="32" rx="3" fill="url(#front)"/>
  </g>
  <!-- play glyph -->
  <path d="M24.5 22.6c0-.8.9-1.3 1.6-.9l7 4.4c.6.4.6 1.3 0 1.7l-7 4.4c-.7.4-1.6-.1-1.6-.9z" fill="#FFFFFF"/>
  <!-- caption bar (telop) -->
  <rect x="20" y="36" width="14" height="3" rx="1.5" fill="#FFFFFF" opacity=".9"/>
  <!-- metaphor 2: sparkle = automatic (AI) editing -->
  <path d="M40.5 3.5c.3 2.7 1.8 4.2 4.5 4.5-2.7.3-4.2 1.8-4.5 4.5-.3-2.7-1.8-4.2-4.5-4.5 2.7-.3 4.2-1.8 4.5-4.5z" fill="url(#spark)"/>
</svg>
