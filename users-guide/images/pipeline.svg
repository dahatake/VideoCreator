<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">生成から最終出力までのパイプライン</title>
  <desc id="desc">素材解析、書き起こし、信号解析、候補選定、編集計画、低解像度プレビュー、人による確認修正、最終レンダリング、段階別QA、成果物の順。キャッシュとLLM失敗時の信号fallbackを示す。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#245a81"/></marker></defs>
  <rect width="1200" height="580" rx="16" fill="#f7f9fc"/>
  <g font-family="'Segoe UI','Meiryo',sans-serif" fill="#19344b" text-anchor="middle">
    <text x="30" y="40" text-anchor="start" font-size="24" font-weight="700">生成は提案、書き出しは確定した計画から作成</text>
    <g fill="#e6f0fb" stroke="#3974a2">
      <rect x="25" y="80" width="190" height="115" rx="10"/><rect x="255" y="80" width="190" height="115" rx="10"/>
      <rect x="485" y="80" width="190" height="115" rx="10"/><rect x="715" y="80" width="190" height="115" rx="10"/>
      <rect x="945" y="80" width="230" height="115" rx="10"/>
    </g>
    <text x="120" y="117" font-size="21" font-weight="700">取り込み</text><text x="120" y="150" font-size="17">権利・形式・SHA</text><text x="120" y="178" font-size="17">プロキシ・音声</text>
    <text x="350" y="117" font-size="21" font-weight="700">書き起こし</text><text x="350" y="150" font-size="17">単語・文・話者</text><text x="350" y="178" font-size="17">時刻を保持</text>
    <text x="580" y="117" font-size="21" font-weight="700">信号解析</text><text x="580" y="150" font-size="17">音量・無音</text><text x="580" y="178" font-size="17">ショット・イベント</text>
    <text x="810" y="117" font-size="21" font-weight="700">候補選定</text><text x="810" y="150" font-size="17">LLM提案→検証</text><text x="810" y="178" font-size="17">信号fallback</text>
    <text x="1060" y="117" font-size="21" font-weight="700">編集計画</text><text x="1060" y="150" font-size="17">カット・文字・音</text><text x="1060" y="178" font-size="17">JSON + plan QA</text>
    <text x="350" y="241" font-size="18">DataDirの段階キャッシュを再利用</text>
    <g fill="#edf7f1" stroke="#28734d">
      <rect x="945" y="300" width="230" height="115" rx="10"/><rect x="715" y="300" width="190" height="115" rx="10"/>
      <rect x="485" y="300" width="190" height="115" rx="10"/><rect x="255" y="300" width="190" height="115" rx="10"/>
      <rect x="25" y="300" width="190" height="115" rx="10"/>
    </g>
    <text x="1060" y="337" font-size="21" font-weight="700">プレビュー</text><text x="1060" y="370" font-size="17">低解像度・比較用</text><text x="1060" y="398" font-size="17">最終QAは未実施</text>
    <text x="810" y="337" font-size="21" font-weight="700">確認・修正</text><text x="810" y="370" font-size="17">人が内容を判断</text><text x="810" y="398" font-size="17">変更→再描画</text>
    <text x="580" y="337" font-size="21" font-weight="700">最終描画</text><text x="580" y="370" font-size="17">1080×1920</text><text x="580" y="398" font-size="17">音量調整</text>
    <text x="350" y="337" font-size="21" font-weight="700">最終QA</text><text x="350" y="370" font-size="17">実ファイルを測定</text><text x="350" y="398" font-size="17">ハード不合格は停止</text>
    <text x="120" y="337" font-size="21" font-weight="700">成果物</text><text x="120" y="370" font-size="17">MP4・字幕・JSON</text><text x="120" y="398" font-size="17">画像・メタデータ</text>
    <text x="30" y="488" text-anchor="start" font-size="19">一括書き出し：候補承認と指紋を全件検証して受付 → 順位順に1本ずつ処理</text>
    <text x="30" y="530" text-anchor="start" font-size="19">直接書き出し：計画QAとAI文承認を検証（候補一覧の承認とは別の入口）</text>
  </g>
  <g fill="none" stroke="#245a81" stroke-width="3" marker-end="url(#arrow)">
    <path d="M215 137H247"/><path d="M445 137H477"/><path d="M675 137H707"/><path d="M905 137H937"/>
    <path d="M1060 195V292"/><path d="M945 357H913"/><path d="M715 357H683"/><path d="M485 357H453"/><path d="M255 357H223"/>
    <path d="M810 300V265H1060V292" stroke-dasharray="5 4"/>
  </g>
</svg>
