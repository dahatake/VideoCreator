name: Pages

# Rebuilds the documentation site whenever the Markdown it is generated from changes.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - users-guide/**
      - docs/**
      - presets/**
      - src/VideoCreator.App/wwwroot/js/server-resources.js
      - Directory.Build.props
      - scripts/verify-localized-docs.mjs
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lastmod in sitemap.xml comes from git history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Verify translated docs keep the Japanese structure
        run: node scripts/verify-localized-docs.mjs

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node build.mjs

      - name: Check SEO, links and sitemap
        working-directory: site
        run: node check.mjs

      - name: Verify in a browser (axe, interactions, reduced motion)
        working-directory: site
        env:
          BROWSER_CHANNEL: chrome
        run: node verify-browser.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
