<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img" aria-labelledby="title desc">
  <title id="title">원본, 본편, 완성 파일의 세 시간축</title>
  <desc id="desc">원본 구간을 컷·배속으로 본편에 변환한다. 10초 본편의 2초에 2초 Opening, 6초에 1초 Card, 10초에 2초 Closing을 넣으면 완성은 15초다. 본편 6초 자막은 완성 9초로 변환한다. 타 카메라 원본 시간에는 offset·drift 보정을 쓴다.</desc>
  <rect width="1200" height="515" rx="16" fill="#f7f9fc"/>
  <g font-family="'Segoe UI','Malgun Gothic',sans-serif" fill="#19344b">
    <text x="28" y="40" font-size="24" font-weight="700">세 시간축을 따로 취급하기</text>
    <text x="28" y="92" font-size="20" font-weight="700">원본 시간</text>
    <rect x="225" y="68" width="220" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="555" y="68" width="220" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="885" y="68" width="220" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <text x="240" y="98" font-size="18">원본 구간 A</text><text x="570" y="98" font-size="18">원본 구간 B</text><text x="900" y="98" font-size="18">원본 구간 C</text>
    <text x="225" y="145" font-size="18">컷·속도·음성 기준으로 본편 변환(원본 시간과 본편 시간은 다름)</text>
    <text x="28" y="206" font-size="20" font-weight="700">본편 시간</text>
    <rect x="225" y="177" width="120" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="345" y="177" width="240" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="585" y="177" width="240" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <text x="275" y="206" font-size="18">A</text><text x="455" y="206" font-size="18">B</text><text x="695" y="206" font-size="18">C</text>
    <text x="225" y="249" font-size="16">0</text><text x="345" y="249" font-size="16">2</text><text x="585" y="249" font-size="16">6</text><text x="810" y="249" font-size="16">10초</text>
    <text x="225" y="281" font-size="18">Telops / SFX / Chapters는 본편 시간으로 유지 → InsertMap 변환</text>
    <text x="28" y="345" font-size="20" font-weight="700">완성 시간</text>
    <rect x="225" y="316" width="120" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="345" y="316" width="120" height="45" fill="#ffe3af" stroke="#ad7123"/>
    <rect x="465" y="316" width="240" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="705" y="316" width="60" height="45" fill="#ffe3af" stroke="#ad7123"/>
    <rect x="765" y="316" width="240" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="1005" y="316" width="120" height="45" fill="#ffe3af" stroke="#ad7123"/>
    <text x="275" y="346" font-size="18">A</text><text x="353" y="346" font-size="18">Opening</text>
    <text x="575" y="346" font-size="18">B</text><text x="713" y="346" font-size="16">Card</text>
    <text x="875" y="346" font-size="18">C</text><text x="1033" y="346" font-size="18">Closing</text>
    <text x="225" y="388" font-size="16">0</text><text x="345" y="388" font-size="16">2</text><text x="465" y="388" font-size="16">4</text>
    <text x="705" y="388" font-size="16">8</text><text x="765" y="388" font-size="16">9</text><text x="1005" y="388" font-size="16">13</text><text x="1110" y="388" font-size="16">15초</text>
    <text x="28" y="440" font-size="18">예: 본편 6초 시작 자막 → 완성 9초 시작. 삽입과 같은 위치 종료는 삽입 앞에서 멈춤.</text>
    <text x="28" y="482" font-size="18">타 카메라 원본 시간 = master 시간 + offset + driftPpm × 10^-6 × master 시간(CameraTime)</text>
  </g>
</svg>
