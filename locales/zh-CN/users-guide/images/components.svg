<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" role="img" aria-labelledby="title desc">
  <title id="title">VideoCreator 组件图</title>
  <desc id="desc">浏览器连接回环 API。Runtime 与 JobQueue 配置 Core 流水线。Core 筛选、规划、渲染、QA，使用本地 SQLite、缓存、文件、FFmpeg、ONNX。音频发给 Speech，文本与信号摘要发给可选 LLM。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#245a81"/></marker></defs>
  <rect width="1240" height="810" rx="16" fill="#f7f9fc"/>
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" fill="#19344b">
    <text x="28" y="40" font-size="24" font-weight="700">VideoCreator | 组件边界</text>
    <rect x="24" y="65" width="872" height="710" rx="12" fill="#fff" stroke="#527998" stroke-dasharray="8 5"/>
    <text x="44" y="96" font-size="19" font-weight="700">本地 Windows PC（单用户）</text>
    <rect x="50" y="118" width="820" height="75" rx="10" fill="#e6f0fb" stroke="#3974a2"/>
    <text x="68" y="148" font-size="20" font-weight="700">浏览器：app.js / HTML / CSS / Fluent Web Components v3</text>
    <text x="68" y="176" font-size="17">哈希路由 + fetch + EventSource + 视频播放</text>
    <text x="495" y="220" font-size="16">HTTP / JSON / SSE | 127.0.0.1</text>
    <rect x="50" y="242" width="820" height="100" rx="10" fill="#e6f0fb" stroke="#3974a2"/>
    <text x="68" y="272" font-size="20" font-weight="700">VideoCreator.App | Program + Api</text>
    <text x="68" y="301" font-size="17">Runtime：提供程序／预设／工具／Store</text>
    <text x="68" y="327" font-size="17">JobQueue：串行生成与最终导出 | JobEvents：SSE 分发</text>
    <rect x="50" y="391" width="820" height="164" rx="10" fill="#edf7f1" stroke="#28734d"/>
    <text x="68" y="422" font-size="20" font-weight="700">VideoCreator.Core | PipelineRunner</text>
    <text x="68" y="453" font-size="17">MediaProbe / Signals / ASR / SelectionService + CandidateValidator</text>
    <text x="68" y="482" font-size="17">PlanBuilder / Solver / Telops / Series / Packaging / CameraTime</text>
    <text x="68" y="511" font-size="17">Renderer / AssWriter / QaEngine / RenderProvenance</text>
    <text x="68" y="540" font-size="17">AudioSync / Faces / ScreenActivity / SuperResolution</text>
    <rect x="50" y="613" width="385" height="128" rx="10" fill="#f0f2f5" stroke="#68798a"/>
    <text x="68" y="644" font-size="20" font-weight="700">本地持久化</text>
    <text x="68" y="674" font-size="17">DataDir：SQLite 文档、缓存、QA</text>
    <text x="68" y="703" font-size="17">ProjectsDir：素材、预览、导出</text>
    <rect x="485" y="613" width="385" height="128" rx="10" fill="#f0f2f5" stroke="#68798a"/>
    <text x="503" y="644" font-size="20" font-weight="700">本地工具与 OS 集成</text>
    <text x="503" y="674" font-size="17">FFmpeg / 字体 / ONNX DirectML</text>
    <text x="503" y="703" font-size="17">文件夹选择／回收站／文件迁移</text>
    <rect x="932" y="242" width="280" height="178" rx="10" fill="#fff1db" stroke="#ad7123"/>
    <text x="950" y="276" font-size="20" font-weight="700">外部：Azure Speech</text>
    <text x="950" y="308" font-size="17">转写所需音频</text>
    <text x="950" y="339" font-size="17">词、时间与说话人</text>
    <text x="950" y="370" font-size="17">Entra ID 身份验证</text>
    <rect x="932" y="465" width="280" height="195" rx="10" fill="#fff1db" stroke="#ad7123"/>
    <text x="950" y="499" font-size="20" font-weight="700">可选外部 LLM</text>
    <text x="950" y="531" font-size="17">Microsoft Foundry / Copilot</text>
    <text x="950" y="562" font-size="17">转写文本与信号摘要</text>
    <text x="950" y="593" font-size="17">候选与文本建议</text>
    <text x="950" y="624" font-size="17">不发送视频帧</text>
  </g>
  <g fill="none" stroke="#245a81" stroke-width="3" marker-end="url(#arrow)">
    <path d="M460 193V234"/><path d="M460 342V383"/>
    <path d="M242 555V605"/><path d="M675 555V605"/>
    <path d="M870 447H906V331H924"/><path d="M870 482H912V555H924"/>
  </g>
</svg>
