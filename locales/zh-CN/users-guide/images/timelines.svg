<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img" aria-labelledby="title desc">
  <title id="title">素材、正文与成品的三个时间轴</title>
  <desc id="desc">源区间通过剪辑和速度转成正文。10 秒正文在 2 秒插 2 秒片头、6 秒插 1 秒卡片、10 秒插 2 秒片尾，成品为 15 秒。正文 6 秒字幕转换为成品 9 秒。其他摄像机使用偏移和漂移修正。</desc>
  <rect width="1200" height="515" rx="16" fill="#f7f9fc"/>
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" fill="#19344b">
    <text x="28" y="40" font-size="24" font-weight="700">分别处理三个时间轴</text>
    <text x="28" y="92" font-size="20" font-weight="700">素材时间</text>
    <rect x="225" y="68" width="220" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="555" y="68" width="220" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="885" y="68" width="220" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <text x="240" y="98" font-size="18">源视频区间 A</text><text x="570" y="98" font-size="18">源视频区间 B</text><text x="900" y="98" font-size="18">源视频区间 C</text>
    <text x="225" y="145" font-size="18">剪辑、速度、音频基准转换为正文（素材与正文时间不相同）</text>
    <text x="28" y="206" font-size="20" font-weight="700">正文时间</text>
    <rect x="225" y="177" width="120" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="345" y="177" width="240" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="585" y="177" width="240" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <text x="275" y="206" font-size="18">A</text><text x="455" y="206" font-size="18">B</text><text x="695" y="206" font-size="18">C</text>
    <text x="225" y="249" font-size="16">0</text><text x="345" y="249" font-size="16">2</text><text x="585" y="249" font-size="16">6</text><text x="810" y="249" font-size="16">10 秒</text>
    <text x="225" y="281" font-size="18">Telops / SFX / Chapters 按正文时间保存 → InsertMap 转换</text>
    <text x="28" y="345" font-size="20" font-weight="700">成品时间</text>
    <rect x="225" y="316" width="120" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="345" y="316" width="120" height="45" fill="#ffe3af" stroke="#ad7123"/>
    <rect x="465" y="316" width="240" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="705" y="316" width="60" height="45" fill="#ffe3af" stroke="#ad7123"/>
    <rect x="765" y="316" width="240" height="45" fill="#dcecfb" stroke="#3974a2"/>
    <rect x="1005" y="316" width="120" height="45" fill="#ffe3af" stroke="#ad7123"/>
    <text x="275" y="346" font-size="18">A</text><text x="353" y="346" font-size="18">片头</text>
    <text x="575" y="346" font-size="18">B</text><text x="713" y="346" font-size="16">卡片</text>
    <text x="875" y="346" font-size="18">C</text><text x="1033" y="346" font-size="18">片尾</text>
    <text x="225" y="388" font-size="16">0</text><text x="345" y="388" font-size="16">2</text><text x="465" y="388" font-size="16">4</text>
    <text x="705" y="388" font-size="16">8</text><text x="765" y="388" font-size="16">9</text><text x="1005" y="388" font-size="16">13</text><text x="1110" y="388" font-size="16">15 秒</text>
    <text x="28" y="440" font-size="18">例：正文 6 秒开始字幕 → 成品 9 秒开始。与插入同点的结束时间停在插入前。</text>
    <text x="28" y="482" font-size="18">其他摄像机素材时间 = master 时间 + offset + driftPpm × 10^-6 × master 时间（CameraTime）</text>
  </g>
</svg>
