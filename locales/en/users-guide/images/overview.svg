<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">VideoCreator: preparation, operations, and deliverables</title>
  <desc id="desc">Prepare authorized speech footage, a Windows PC, and Speech settings. Add assets, choose a pattern, generate candidates, review and edit, then export MP4, subtitles, edit plans, thumbnails, and metadata. Cloud transmission and manual publication boundaries are shown.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#245a81"/></marker></defs>
  <rect width="1200" height="430" rx="16" fill="#f5f8fc"/>
  <g font-family="'Segoe UI',sans-serif" fill="#19344b">
    <text x="28" y="40" font-size="24" font-weight="700">From long footage to a video you can review and post</text>
    <rect x="28" y="72" width="280" height="255" rx="12" fill="#e6f0fb" stroke="#3974a2"/>
    <text x="48" y="108" font-size="22" font-weight="700">1. Prepare</text>
    <text x="48" y="148" font-size="17">Rights-cleared footage</text>
    <text x="48" y="180" font-size="17">Windows PC and storage</text>
    <text x="48" y="212" font-size="17">Speech settings and access</text>
    <text x="48" y="256" font-size="16">Optional: OpenAI / Copilot</text>
    <text x="48" y="284" font-size="15">BGM, cameras, branded clips</text>
    <rect x="360" y="72" width="455" height="255" rx="12" fill="#fff" stroke="#3974a2"/>
    <text x="380" y="108" font-size="22" font-weight="700">2. Work in the app</text>
    <text x="380" y="148" font-size="17">Add assets / confirm rights → choose pattern</text>
    <text x="380" y="180" font-size="17">Check destinations / cost → generate</text>
    <text x="380" y="212" font-size="17">Play / edit subtitles and audio → export</text>
    <text x="380" y="256" font-size="16">Normal: up to three highlight candidates</text>
    <text x="380" y="284" font-size="16">Series: divide the whole source into parts</text>
    <rect x="867" y="72" width="305" height="255" rx="12" fill="#e8f5ee" stroke="#28734d"/>
    <text x="887" y="108" font-size="22" font-weight="700">3. Deliverables</text>
    <text x="887" y="148" font-size="18">MP4: 1080×1920</text>
    <text x="887" y="180" font-size="18">SRT / ASS: subtitles</text>
    <text x="887" y="212" font-size="18">JSON: edit plan</text>
    <text x="887" y="244" font-size="18">Three thumbnail images</text>
    <text x="887" y="276" font-size="18">Suggested post metadata</text>
    <text x="28" y="365" font-size="17">Video editing stays local. Normally audio → Speech; transcript / signal summary → optional LLM.</text>
    <text x="28" y="402" font-size="17" font-weight="700">QA assists review. Check content and rights yourself; upload to social platforms manually.</text>
  </g>
  <g stroke="#245a81" stroke-width="3" marker-end="url(#arrow)"><path d="M308 190H352"/><path d="M815 190H859"/></g>
</svg>
