<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline from generation to final export</title>
  <desc id="desc">Ingest, transcription, signals, candidate selection, edit planning, low-resolution previews, human review/editing, final rendering, staged QA, and deliverables. Reuse stage caches; fall back to signals when LLM selection fails.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#245a81"/></marker></defs>
  <rect width="1200" height="580" rx="16" fill="#f7f9fc"/>
  <g font-family="'Segoe UI',sans-serif" fill="#19344b" text-anchor="middle">
    <text x="30" y="40" text-anchor="start" font-size="24" font-weight="700">Generation proposes; export renders the finalized plan</text>
    <g fill="#e6f0fb" stroke="#3974a2">
      <rect x="25" y="80" width="190" height="115" rx="10"/><rect x="255" y="80" width="190" height="115" rx="10"/>
      <rect x="485" y="80" width="190" height="115" rx="10"/><rect x="715" y="80" width="190" height="115" rx="10"/>
      <rect x="945" y="80" width="230" height="115" rx="10"/>
    </g>
    <text x="120" y="117" font-size="21" font-weight="700">Ingest</text><text x="120" y="150" font-size="16">Rights / format / SHA</text><text x="120" y="178" font-size="17">Proxy / audio</text>
    <text x="350" y="117" font-size="21" font-weight="700">Transcription</text><text x="350" y="150" font-size="16">Words / sentences</text><text x="350" y="178" font-size="16">Speakers / timings</text>
    <text x="580" y="117" font-size="21" font-weight="700">Signals</text><text x="580" y="150" font-size="17">Volume / silence</text><text x="580" y="178" font-size="17">Shots / events</text>
    <text x="810" y="117" font-size="21" font-weight="700">Selection</text><text x="810" y="150" font-size="16">LLM → validation</text><text x="810" y="178" font-size="16">Signal fallback</text>
    <text x="1060" y="117" font-size="21" font-weight="700">Edit plan</text><text x="1060" y="150" font-size="17">Cuts / text / audio</text><text x="1060" y="178" font-size="17">JSON + plan QA</text>
    <text x="350" y="241" font-size="18">Reuse stage caches in DataDir</text>
    <g fill="#edf7f1" stroke="#28734d">
      <rect x="945" y="300" width="230" height="115" rx="10"/><rect x="715" y="300" width="190" height="115" rx="10"/>
      <rect x="485" y="300" width="190" height="115" rx="10"/><rect x="255" y="300" width="190" height="115" rx="10"/>
      <rect x="25" y="300" width="190" height="115" rx="10"/>
    </g>
    <text x="1060" y="337" font-size="21" font-weight="700">Preview</text><text x="1060" y="370" font-size="16">Low-res comparison</text><text x="1060" y="398" font-size="16">Final QA not run</text>
    <text x="810" y="337" font-size="21" font-weight="700">Review / edit</text><text x="810" y="370" font-size="16">Human judgment</text><text x="810" y="398" font-size="16">Changes → rerender</text>
    <text x="580" y="337" font-size="21" font-weight="700">Final render</text><text x="580" y="370" font-size="17">1080×1920</text><text x="580" y="398" font-size="17">Loudness control</text>
    <text x="350" y="337" font-size="21" font-weight="700">Final QA</text><text x="350" y="370" font-size="16">Measure real file</text><text x="350" y="398" font-size="16">Hard failure → stop</text>
    <text x="120" y="337" font-size="21" font-weight="700">Deliverables</text><text x="120" y="370" font-size="16">MP4 / subtitles / JSON</text><text x="120" y="398" font-size="16">Images / metadata</text>
    <text x="30" y="488" text-anchor="start" font-size="18">Bulk export: validate every candidate's approval and fingerprint → process one at a time in rank order.</text>
    <text x="30" y="530" text-anchor="start" font-size="18">Direct export: validate plan QA and AI-text approval (a separate entry from candidate-list approval).</text>
  </g>
  <g fill="none" stroke="#245a81" stroke-width="3" marker-end="url(#arrow)">
    <path d="M215 137H247"/><path d="M445 137H477"/><path d="M675 137H707"/><path d="M905 137H937"/>
    <path d="M1060 195V292"/><path d="M945 357H913"/><path d="M715 357H683"/><path d="M485 357H453"/><path d="M255 357H223"/>
    <path d="M810 300V265H1060V292" stroke-dasharray="5 4"/>
  </g>
</svg>
